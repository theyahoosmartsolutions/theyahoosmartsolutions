function b2u(b){return Uint8Array.from(atob(b),function(c){return c.charCodeAt(0)})}
function u2b(u){var s="";for(var i=0;i<u.length;i+=8192)s+=String.fromCharCode.apply(null,u.subarray(i,i+8192));return btoa(s)}
