<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GST Invoice Entry</title>
<style>
:root{--bg:#f3f4f6;--panel:#fff;--ink:#1a1d23;--mute:#5d6470;--line:#d6d9df;--acc:#1f5fbf;--accink:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14171c;--panel:#1d2128;--ink:#e8eaee;--mute:#9aa1ad;--line:#333a45;--acc:#5b93e6;--accink:#0d1116}}
:root[data-theme="dark"]{--bg:#14171c;--panel:#1d2128;--ink:#e8eaee;--mute:#9aa1ad;--line:#333a45;--acc:#5b93e6;--accink:#0d1116}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*:before,*:after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.4 "Segoe UI",system-ui,Arial,sans-serif}
.app{display:grid;grid-template-columns:minmax(320px,440px) 1fr;gap:16px;padding:16px;max-width:1400px;margin:0 auto}
@media(max-width:900px){.app{grid-template-columns:1fr}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px}
h1{font-size:18px;margin:0 0 10px}
h2{font-size:14px;margin:14px 0 6px;padding-top:10px;border-top:1px solid var(--line)}
h2:first-of-type{border:0;padding:0;margin-top:0}
label{display:block;font-size:12px;color:var(--mute);margin:6px 0 2px}
input,textarea,select{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:5px;padding:6px 8px}
textarea{resize:vertical;min-height:54px}
.r2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.item{border:1px solid var(--line);border-radius:6px;padding:8px;margin-bottom:8px}
.item .r4{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:6px}
button{font:inherit;cursor:pointer;border-radius:5px;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:7px 12px}
button.p{background:var(--acc);color:var(--accink);border-color:var(--acc)}
.bar{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.chk{display:flex;gap:8px;align-items:center;margin-top:8px;color:var(--ink);font-size:13px}
.chk input{width:auto}
.saved div{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid var(--line);font-size:13px}
.pv{overflow-x:auto}
.pvhead{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.pvhead select{width:auto}
/* invoice sheet: always white paper */
.sheet{background:#fff;color:#000;width:780px;margin:0 auto;padding:10px 14px;font:11px/1.35 Arial,Helvetica,sans-serif}
.sheet .t{text-align:center;font-weight:700;font-size:15px;position:relative;margin-bottom:4px}
.sheet .t i{position:absolute;right:0;top:2px;font-weight:400;font-size:11px}
.sheet table{width:100%;border-collapse:collapse}
.sheet td,.sheet th{border:1px solid #000;padding:2px 5px;vertical-align:top}
.sheet th{font-weight:400;text-align:center}
.sheet .n{border:0;border-left:1px solid #000;border-right:1px solid #000}
.sheet .r{text-align:right}.sheet .b{font-weight:700}
.sheet .sm{font-size:10px;color:#333}
.sheet .fill td{height:150px}
.sheet .c{text-align:center}
#pa{display:none}
@media print{
 body{background:#fff}.app{display:none}#pa{display:block}
 #pa .sheet{width:100%;page-break-after:always;margin:0}
 #pa .sheet:last-child{page-break-after:auto}
 @page{size:A4;margin:10mm}
}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body>
<div class="app">
 <div class="panel" id="form">
  <h1>GST Invoice Entry</h1>
  <h2>Invoice</h2>
  <div class="r2">
   <div><label>Invoice no.</label><input id="no"></div>
   <div><label>Date</label><input id="date" type="date"></div>
  </div>
  <div class="chk"><input type="checkbox" id="igst"><span>Inter-state supply (charge IGST instead of CGST + SGST)</span></div>
  <h2>Seller (your company)</h2>
  <label>Name</label><input id="sname">
  <label>Address</label><textarea id="saddr"></textarea>
  <div class="r2">
   <div><label>GSTIN</label><input id="sgstin"></div>
   <div><label>PAN</label><input id="span"></div>
   <div><label>State name</label><input id="sstate"></div>
   <div><label>State code</label><input id="scode"></div>
   <div><label>CIN</label><input id="scin"></div>
   <div><label>E-mail</label><input id="smail"></div>
   <div><label>Website</label><input id="sweb"></div>
  </div>
  <h2>Buyer</h2>
  <label>Customer master</label><select id="cust" onchange="pickCust()"></select>
  <div class="bar" style="margin:6px 0 0"><button onclick="saveCust()">Save buyer to master</button><button onclick="delCust()">Delete selected</button></div>
  <label>Name</label><input id="bname">
  <label>Address</label><textarea id="baddr"></textarea>
  <div class="r2">
   <div><label>GSTIN</label><input id="bgstin"></div>
   <div><label>State name</label><input id="bstate"></div>
   <div><label>State code</label><input id="bcode"></div>
   <div><label>Place of supply</label><input id="bpos"></div>
  </div>
  <h2>Items (rate excludes tax)</h2>
  <div id="items"></div>
  <button onclick="addItem()">+ Add item</button>
  <h2>E-way bill</h2>
  <div class="r2">
   <div><label>E-way bill no.</label><input id="ewb"></div>
   <div><label>Vehicle no.</label><input id="veh"></div>
   <div><label>Transporter name</label><input id="trn"></div>
   <div><label>Transporter ID / GSTIN</label><input id="trg"></div>
   <div><label>Distance (km)</label><input id="dist" type="number" min="0"></div>
   <div><label>Destination</label><input id="dest"></div>
  </div>
  <div id="ewhint" style="font-size:12px;color:var(--mute);margin-top:6px"></div>
  <h2>Bank &amp; footer</h2>
  <div class="r2">
   <div><label>A/c holder name</label><input id="bacname"></div>
   <div><label>Bank name</label><input id="bank"></div>
   <div><label>A/c no.</label><input id="acno"></div>
   <div><label>Branch &amp; IFS code</label><input id="ifsc"></div>
   <div><label>Jurisdiction</label><input id="jur"></div>
  </div>
  <div class="chk"><input type="checkbox" id="seal"><span>Show seal and signature on invoice</span></div>
  <div class="bar">
   <button class="p" onclick="save()">Save invoice</button>
   <button onclick="printAll()">Print 3 copies</button>
   <button onclick="newInv()">New invoice</button>
   <button onclick="exportInv()">Excel: this invoice</button>
   <button onclick="exportAll()">Excel: all saved</button>
  </div>
  <h2>Saved invoices</h2>
  <div class="saved" id="saved"></div>
 </div>
 <div class="panel pv">
  <div class="pvhead">
   <b>Preview</b>
   <select id="copy" onchange="render()">
    <option>(ORIGINAL FOR RECIPIENT)</option>
    <option>(DUPLICATE FOR TRANSPORTER)</option>
    <option>(TRIPLICATE FOR SUPPLIER)</option>
   </select>
   <button onclick="window.print()">Print this copy</button>
  </div>
  <div id="sheet"></div>
 </div>
</div>
<div id="pa"></div>

  '<tr><td>Despatch Document No.<br>&nbsp;</td><td>Delivery Note Date<br>&nbsp;</td></tr>'+
  '<tr><td>Despatched through<br>'+esc(s.trn+(s.trn&&s.veh?' / ':'')+s.veh)+'&nbsp;</td><td>Destination<br>'+esc(s.dest)+'&nbsp;</td></tr></table>';
 if(s.ewb||s.veh||s.trg||s.dist)h+='<table><tr><td>E-Way Bill No.: <b>'+esc(s.ewb)+'</b></td><td>Vehicle No.: <b>'+esc(s.veh)+'</b></td><td>Transporter ID: <b>'+esc(s.trg)+'</b></td><td>Distance: <b>'+esc(s.dist)+(s.dist?' km':'')+'</b></td></tr></table>';
 h+='<table><tr><th style="width:4%">Sl No.</th><th>Description of Goods</th><th style="width:11%">HSN/SAC</th><th style="width:10%">Quantity</th><th style="width:11%">Rate</th><th style="width:5%">per</th><th style="width:13%">Amount</th></tr>';
 var d1="",d2="",d3="",d4="",d5="",d6="",d7="";
 c.rows.forEach(function(x,i){d1+=(i+1)+"<br>";d2+='<b>'+esc(x.it.d)+'</b><br>';d3+=esc(x.it.hsn)+"<br>";d4+='<b>'+x.q+' '+esc(x.it.u)+'</b><br>';d5+=fm(x.r)+"<br>";d6+=esc(x.it.u)+"<br>";d7+='<b>'+fm(x.a)+'</b><br>'});
 var tx=ig?'<b><i>IGST '+c.g+'%</i></b>':'<b><i>CGST '+(c.g/2)+'%<br>SGST '+(c.g/2)+'%</i></b>';
 var ta=ig?'<b>'+fm(c.ti)+'</b>':'<b>'+fm(c.tc)+'<br>'+fm(c.ts)+'</b>';
 h+='<tr class="fill"><td class="n">'+d1+'</td><td class="n">'+d2+'<div style="text-align:right;margin-top:24px">'+tx+'<br><b><i>Round Off</i></b></div></td><td class="n">'+d3+'</td><td class="n">'+d4+'</td><td class="n r">'+d5+'</td><td class="n">'+d6+'</td><td class="n r">'+d7+
  '<div style="border-top:1px solid #000;margin-top:14px">'+fm(c.sub)+'</div><div style="margin-top:8px">'+ta+'<br><b>'+(c.ro<0?"(-)"+fm(-c.ro):c.ro>0?fm(c.ro):"")+'</b></div></td></tr>';
 h+='<tr><td></td><td class="r">Total</td><td></td><td class="b">'+c.qty+' Nos</td><td></td><td></td><td class="r b" style="font-size:14px">&#8377; '+fm(c.tot)+'</td></tr></table>';
 h+='<table><tr><td style="border-bottom:0">Amount Chargeable (in words)<span style="float:right"><i>E. &amp; O.E</i></span><br><b style="font-size:12px">'+money(c.tot)+'</b></td></tr></table>';
 h+='<table><tr><th rowspan="2">HSN/SAC</th><th rowspan="2">Taxable Value</th>'+(ig?'<th colspan="2">Integrated Tax</th>':'<th colspan="2">Central Tax</th><th colspan="2">State Tax</th>')+'<th rowspan="2">Total Tax Amount</th></tr><tr>'+(ig?'<th>Rate</th><th>Amount</th>':'<th>Rate</th><th>Amount</th><th>Rate</th><th>Amount</th>')+'</tr>';
 c.hs.forEach(function(x){h+='<tr><td>'+esc(x.hsn)+'</td><td class="r">'+fm(x.tv)+'</td>'+(ig?'<td class="r">'+x.g+'%</td><td class="r">'+fm(x.i)+'</td>':'<td class="r">'+x.g/2+'%</td><td class="r">'+fm(x.c)+'</td><td class="r">'+x.g/2+'%</td><td class="r">'+fm(x.s)+'</td>')+'<td class="r">'+fm(x.t)+'</td></tr>'});
 h+='<tr class="b"><td class="r">Total</td><td class="r">'+fm(c.sub)+'</td>'+(ig?'<td></td><td class="r">'+fm(c.ti)+'</td>':'<td></td><td class="r">'+fm(c.tc)+'</td><td></td><td class="r">'+fm(c.ts)+'</td>')+'<td class="r">'+fm(c.tt)+'</td></tr></table>';
 h+='<table><tr><td style="border-bottom:0;border-top:0">Tax Amount (in words) : <b style="font-size:12px">'+money(c.tt)+'</b><div style="height:34px"></div></td></tr></table>';
 h+='<table><tr><td style="width:50%;border-top:0;border-bottom:0">Company\'s PAN : <b>'+esc(s.span)+'</b><br><u>Declaration</u><br>We declare that this invoice shows the actual price of the goods described and that all particulars are true and correct.</td>'+
  '<td style="border-top:0;border-bottom:0">Company\'s Bank Details<br>'+(s.bacname?'A/c Holder : <b>'+esc(s.bacname)+'</b><br>':'')+'Bank Name : <b>'+esc(s.bank)+'</b><br>A/c No. : <b>'+esc(s.acno)+'</b><br>Branch &amp; IFS Code : <b>'+esc(s.ifsc)+'</b></td></tr>'+
  '<tr><td style="height:56px">Customer\'s Seal and Signature</td><td class="r"><b>for '+esc(s.sname)+'</b>'+(s.seal?'<div><img src="'+SEAL+'" alt="" style="height:72px;width:auto"></div>':'<div style="height:32px"></div>')+'Authorised Signatory</td></tr></table>';
 h+='<div class="c" style="margin-top:6px">'+esc(s.jur)+'<br><span class="sm">This is a Computer Generated Invoice</span></div></div>';
 return h}

function render(){$("sheet").innerHTML=sheet($("copy").value);sv(DKEY,S);var t=calc().tot;$("ewhint").textContent=t>50000?"Invoice value is above \u20b950,000, so an e-way bill is generally needed to move these goods. Generate it on the GST e-way bill portal and enter the number here.":"Invoice value is \u20b950,000 or less, so an e-way bill is generally not needed. Fill these fields only if you have one."}
function printAll(){var o=$("copy").options,h="";for(var i=0;i<o.length;i++)h+=sheet(o[i].value);$("pa").innerHTML=h;window.print()}
var CK="gst_customers_v1";
function cust(){return ld(CK)||[]}
function drawCust(sel){$("cust").innerHTML='<option value="">Select saved customer</option>'+cust().map(function(x,i){return '<option value="'+i+'">'+esc(x.bname)+'</option>'}).join("");if(sel!=null)$("cust").value=sel}
function pickCust(){var v=$("cust").value;if(v==="")return;var x=cust()[v];["bname","baddr","bgstin","bstate","bcode","bpos"].forEach(function(k){S[k]=x[k]||""});fillForm();$("cust").value=v}
function saveCust(){if(!S.bname){alert("Enter the buyer name first.");return}var o={};["bname","baddr","bgstin","bstate","bcode","bpos"].forEach(function(k){o[k]=S[k]});var L=cust().filter(function(x){return x.bname!==o.bname});L.push(o);L.sort(function(a,b){return a.bname.localeCompare(b.bname)});sv(CK,L);drawCust(L.findIndex(function(x){return x.bname===o.bname}))}
function delCust(){var v=$("cust").value;if(v==="")return;var L=cust();L.splice(v,1);sv(CK,L);drawCust()}
async function saveXlsx(name,wb){
 if(!window.XLSX){alert("The Excel library did not load. Check your connection and try again.");return}
 var dl=null;try{dl=window.claude&&await claude.use("downloads")}catch(e){}
 if(!dl){try{XLSX.writeFile(wb,name)}catch(e){alert("Could not save the file.")}return}
 try{await dl.save({filename:name,data:XLSX.write(wb,{type:"array",bookType:"xlsx"})})}catch(e){if(e&&e.code!=="declined")alert("Could not save the file ("+(e.code||"error")+").")}}
function exportInv(){
 if(!window.XLSX){alert("The Excel library did not load. Check your connection and try again.");return}
 var c=calc(),s=S,g=c.ig;
 var A=[["Invoice No.",s.no],["Date",dt(s.date)],["Seller",s.sname],["Seller GSTIN",s.sgstin],["Buyer",s.bname],["Buyer GSTIN",s.bgstin],["Place of Supply",s.bpos],["E-Way Bill No.",s.ewb],["Vehicle No.",s.veh],["Transporter",s.trn],[],["Sl","Description","HSN/SAC","Qty","Unit","Rate","GST %","Amount"]];
 c.rows.forEach(function(x,i){A.push([i+1,x.it.d,x.it.hsn,x.q,x.it.u,x.r,+x.it.g||0,x.a])});
 A.push([],["","","","","","","Taxable value",c.sub]);
 if(g)A.push(["","","","","","","IGST",c.ti]);else A.push(["","","","","","","CGST",c.tc],["","","","","","","SGST",c.ts]);
 A.push(["","","","","","","Round off",c.ro],["","","","","","","Total",c.tot]);
 var H=[g?["HSN/SAC","Taxable value","GST %","IGST","Total tax"]:["HSN/SAC","Taxable value","GST %","CGST","SGST","Total tax"]];
 c.hs.forEach(function(x){H.push(g?[x.hsn,x.tv,x.g,x.i,x.t]:[x.hsn,x.tv,x.g,x.c,x.s,x.t])});
 var wb=XLSX.utils.book_new(),w=XLSX.utils.aoa_to_sheet(A);w["!cols"]=[{wch:14},{wch:34},{wch:12},{wch:8},{wch:8},{wch:12},{wch:12},{wch:14}];
 XLSX.utils.book_append_sheet(wb,w,"Invoice");XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(H),"HSN summary");
 saveXlsx("Invoice-"+String(s.no).replace(/[^\w-]+/g,"-")+".xlsx",wb)}
function exportAll(){
 if(!window.XLSX){alert("The Excel library did not load. Check your connection and try again.");return}
 var L=list();if(!L.length){alert("No saved invoices yet. Select Save invoice first.");return}
 var A=[["Invoice No.","Date","Buyer","Buyer GSTIN","Place of Supply","Taxable value","CGST","SGST","IGST","Round off","Total","E-Way Bill No.","Vehicle No."]],o=S;
 L.forEach(function(v){S=v;var c=calc();A.push([v.no,dt(v.date),v.bname,v.bgstin,v.bpos,c.sub,c.tc,c.ts,c.ti,c.ro,c.tot,v.ewb,v.veh])});
 S=o;var wb=XLSX.utils.book_new(),w=XLSX.utils.aoa_to_sheet(A);w["!cols"]=[{wch:16},{wch:12},{wch:28},{wch:18},{wch:16},{wch:14},{wch:10},{wch:10},{wch:10},{wch:10},{wch:12},{wch:16},{wch:14}];
 XLSX.utils.book_append_sheet(wb,w,"Sales register");saveXlsx("Sales-register.xlsx",wb)}
function fillForm(){F.forEach(function(k){$(k).value=S[k]||""});$("igst").checked=!!S.igst;$("seal").checked=!!S.seal;drawItems();render()}
function drawItems(){
 $("items").innerHTML=S.items.map(function(it,i){return '<div class="item"><label>Description</label><input value="'+esc(it.d)+'" oninput="up('+i+',\'d\',this.value)">'+
  '<div class="r4"><div><label>HSN/SAC</label><input value="'+esc(it.hsn)+'" oninput="up('+i+',\'hsn\',this.value)"></div>'+
  '<div><label>Qty</label><input type="number" min="0" step="any" value="'+it.q+'" oninput="up('+i+',\'q\',this.value)"></div>'+
  '<div><label>Rate</label><input type="number" min="0" step="any" value="'+it.r+'" oninput="up('+i+',\'r\',this.value)"></div>'+
  '<div><label>GST %</label><input type="number" min="0" step="any" value="'+it.g+'" oninput="up('+i+',\'g\',this.value)"></div></div>'+
  '<div style="display:flex;justify-content:space-between;align-items:end;margin-top:6px"><div style="width:90px"><label>Unit</label><input value="'+esc(it.u)+'" oninput="up('+i+',\'u\',this.value)"></div>'+
  (S.items.length>1?'<button onclick="delItem('+i+')">Remove</button>':'')+'</div></div>'}).join("")}
function up(i,k,v){S.items[i][k]=v;render()}
function addItem(){var l=S.items[S.items.length-1]||{};S.items.push({d:"",hsn:"",q:1,r:0,g:l.g||18,u:"Nos"});drawItems();render()}
function delItem(i){S.items.splice(i,1);drawItems();render()}
function nextNo(n){var m=String(n).match(/^(.*?)(\d+)(\D*)$/);if(!m)return n;var d=String(+m[2]+1);while(d.length<m[2].length)d="0"+d;return m[1]+d+m[3]}
function list(){return ld(KEY)||[]}
function save(){var L=list().filter(function(x){return x.no!==S.no});L.unshift(JSON.parse(JSON.stringify(S)));sv(KEY,L);drawSaved()}
function newInv(){var n=nextNo(S.no);S.no=n;S.date=new Date().toISOString().slice(0,10);S.bname=S.baddr=S.bgstin=S.ewb=S.veh=S.trn=S.trg=S.dist=S.dest="";S.items=[{d:"",hsn:"",q:1,r:0,g:18,u:"Nos"}];fillForm()}
function drawSaved(){var L=list();$("saved").innerHTML=L.length?L.map(function(x,i){var c=Object;return '<div><span>'+esc(x.no)+' &middot; '+esc(x.bname||"-")+'</span><span><button onclick="loadInv('+i+')">Open</button> <button onclick="delInv('+i+')">Delete</button></span></div>'}).join(""):'<span style="color:var(--mute)">No saved invoices yet. Fill the form and select Save invoice.</span>'}
function loadInv(i){S=Object.assign({},D,list()[i]);fillForm()}
function delInv(i){var L=list();L.splice(i,1);sv(KEY,L);drawSaved()}
F.forEach(function(k){$(k).addEventListener("input",function(){S[k]=this.value;render()})});
$("seal").addEventListener("change",function(){S.seal=this.checked;render()});
$("igst").addEventListener("change",function(){S.igst=this.checked;render()});
var dr=ld(DKEY);if(dr&&dr.items)S=Object.assign({},D,dr);
fillForm();drawSaved();drawCust();
</script>
